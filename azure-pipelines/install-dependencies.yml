parameters:
- name: restoreProjects
  type: boolean
  default: true
- name: needsAzurePublicFeeds
  type: boolean
  default: true # If nuget.config pulls from the azure-public account, we need to authenticate when building on the devdiv account.

steps:
- task: UseDotNet@2
  displayName: ⚙ Install .NET SDKs and runtimes
  inputs:
    packageType: sdk
    useGlobalJson: true
    workingDirectory: $(Build.SourcesDirectory)

- ${{ if and(parameters.needsAzurePublicFeeds, eq(variables['system.collectionId'], '011b8bdf-6d56-4f87-be0d-0092136884d9')) }}:
  - template: WIFtoPATauth.yml
    parameters:
      wifServiceConnectionName: azure-public/vside package pull
      deadPATServiceConnectionId: 0ae39abc-4d06-4436-a7b5-865833df49db # azure-public/msft_consumption

- task: NuGetAuthenticate@1
  displayName: 🔏 Authenticate NuGet feeds
  inputs:
    ${{ if and(parameters.needsAzurePublicFeeds, eq(variables['system.collectionId'], '011b8bdf-6d56-4f87-be0d-0092136884d9')) }}:
      nuGetServiceConnections: azure-public/msft_consumption

- powershell: |
    $procDumpPath = & ./tools/Get-ProcDump.ps1 -ConfigFile ./azure-pipelines/nuget.config
    Write-Host "##vso[task.setvariable variable=PROCDUMP_PATH]$procDumpPath"
  displayName: ⚙ Configure crash-dump collection
  condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'))

- ${{ if parameters.restoreProjects }}:
  - script: dotnet restore --configfile azure-pipelines/nuget.config
    displayName: 📦 Restore project packages
    env:
      NUGET_PLUGIN_HANDSHAKE_TIMEOUT_IN_SECONDS: 20
      NUGET_PLUGIN_REQUEST_TIMEOUT_IN_SECONDS: 20

- script: dotnet tool restore --configfile azure-pipelines/nuget.config
  displayName: ⚙ Restore CLI tools
  env:
    NUGET_PLUGIN_HANDSHAKE_TIMEOUT_IN_SECONDS: 20
    NUGET_PLUGIN_REQUEST_TIMEOUT_IN_SECONDS: 20

- script: dotnet --info
  displayName: ⚙ Show .NET environment

- powershell: tools/variables/_define.ps1
  failOnStderr: true
  displayName: ⚙ Set pipeline variables based on source
  name: SetPipelineVariables
